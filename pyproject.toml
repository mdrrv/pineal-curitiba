[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pineal-curitiba"
version = "0.2.0"
description = "Funil de inteligência territorial B2B para Curitiba"
requires-python = ">=3.11"
# versões fixas: a mesma combinação testada no CI. Atualize todas juntas e rode os testes.
dependencies = [
    "duckdb==1.5.6",
    "geopandas==1.2.0",
    "h3==4.5.0",
    "psycopg2-binary==2.9.13",
    "pyarrow==25.0.1",
    "pyogrio==0.13.0",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "shapely==2.1.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.10"]

[tool.setuptools]
packages = ["etl", "etl.fontes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731", "E501"]  # E501: SQL em strings; o formatter cuida do resto
