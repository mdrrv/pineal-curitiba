    frequencia: mensal
    obs: "sem CNPJ: cruzamento por CEP, endereço, nome empresarial/fantasia e CNAE. Colunas-chave: NOME_EMPRESARIAL, NOME_FANTASIA, INICIO_ATIVIDADE, NUMERO_DO_ALVARA, DATA_EMISSAO, DATA_EXPIRACAO, ENDERECO, NUMERO, BAIRRO, CEP, CNAE_ATIVIDADE_PRINCIPAL e 20 CNAE secundários. Arquivo mensal de ~540 MB"
    script: etl/fontes/pmc_alvaras.py

  - id: pmc_licitacoes
