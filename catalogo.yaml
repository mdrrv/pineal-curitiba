# Catálogo de fontes do Pineal Curitiba.
#
# status:   ativo (script pronto) | inventariado (colunas e arquivos confirmados no portal; sem ETL ainda)
#           | a_conferir (link/colunas a confirmar no primeiro download)
#           | planejado (sem script ainda) | lai (só via pedido de acesso à informação) | convenio
#           | fora (mapeada e descartada, com o motivo em obs)
# fase:     M0 fundação | M1 prefeitura/IPPUC | M1-seg segurança | M1b listas com CNPJ | M2 contexto
# chaves:   cnpj | cnpj_talvez (a confirmar) | end (endereço) | nome | cnae | geo (coordenada) | terr (território agregado)
#           | lote (indicação fiscal)
#
# Município: variáveis PINEAL_COD_IBGE, PINEAL_COD_RFB, PINEAL_NOME_MUNICIPIO e PINEAL_UF no .env.
# O que o script usa: url, url_diretorio + padrao_arquivo, portal_chave, camadas. O resto documenta.

fontes:

  # ---------------------------------------------------------------- M0: fundação territorial

  - id: ibge_setores
    nome: Malha de setores censitários 2022
    dono: IBGE
    fase: M0
    status: a_conferir
    chaves: [geo]
    formato: shp (zip por UF)
    periodicidade: decenal
    url_diretorio: https://geoftp.ibge.gov.br/organizacao_do_territorio/malhas_territoriais/malhas_de_setores_censitarios__divisoes_intramunicipais/censo_2022/setores/shp/UF/
    padrao_arquivo: '^PR_.*\.zip$'
    script: etl/fontes/ibge_setores.py

  - id: ibge_cnefe
    nome: CNEFE 2022 (endereços com coordenada)
    dono: IBGE
    fase: M0
    status: a_conferir
    chaves: [end, geo]
    formato: csv (zip por município)
    periodicidade: decenal
    url_diretorio: https://ftp.ibge.gov.br/Cadastro_Nacional_de_Enderecos_para_Fins_Estatisticos/Censo_Demografico_2022/Arquivos_CNEFE/CSV/Municipio/41_PR/
    padrao_arquivo: '^4106902.*\.zip$'
    script: etl/fontes/ibge_cnefe.py

  - id: ippuc
    nome: Base vetorial do IPPUC
    dono: IPPUC
    fase: M0
    status: a_conferir
    chaves: [geo, lote]
    formato: shp/dxf
    obs: >
      Sem link direto estável conhecido. Baixar no site do IPPUC ou GeoCuritiba e colocar em
      dados/bruto/ippuc/. Arruamento, quadras, lotes, hidrografia e parques ficam para o M2.
    script: etl/fontes/ippuc.py
    camadas:
      bairro:
        padrao_arquivo: 'bairro'
        campo_nome: null      # null = detecta; ajuste depois de rodar --listar
        campo_codigo: null
        crs_padrao: 31982     # SIRGAS 2000 / UTM 22S, usado só se o arquivo vier sem .prj
      regional:
        padrao_arquivo: 'regiona'
        campo_nome: null
        campo_codigo: null
        crs_padrao: 31982
      zoneamento:
        padrao_arquivo: 'zone|zona'
        campo_nome: null
        campo_codigo: null
        crs_padrao: 31982

  - id: rfb_cnpj
    nome: Recorte de dados_rfb.cnpj_consolidado
    dono: Receita Federal (ETL MINDATA)
    fase: M0
    status: ativo
    chaves: [cnpj, end]
    periodicidade: mensal
    script: etl/fontes/cnpj_recorte.py

  # ---------------------------------------------------------------- M2: apoio e cruzamentos (scripts prontos)

  - id: ibge_cnae
    nome: Hierarquia da CNAE 2.3 (seção, divisão, grupo, classe, subclasse)
    dono: IBGE (CONCLA)
    fase: M2
    status: a_conferir
    chaves: [cnae]
    url: https://servicodados.ibge.gov.br/api/v2/cnae/subclasses
    obs: sem resposta da API, usa dados_rfb.cnae (só a descrição da subclasse)
    script: etl/fontes/apoio.py

  - id: mindata_cruzamentos
    nome: PNCP, TCE-PR, PGFN e sanções federais por CNPJ
    dono: ETL MINDATA (dados_rfb.pncp_contratos, tce_pr_contratos, pgfn_divida_ativa, sancoes_federais)
    fase: M2
    status: ativo
    chaves: [cnpj]
    obs: lê do banco RFB, sem baixar nada; tabela ausente é pulada
    script: etl/fontes/mindata_cruzamentos.py

  - id: overture_edificacoes
    nome: Edificações (Overture Buildings) por hexágono H3
    dono: Overture Maps Foundation
    fase: M2
    status: a_conferir
    chaves: [geo]
    licenca: ODbL
    release: null   # sem listagem do bucket, informe aqui a release (ex.: 2026-09-17.0)
    script: etl/fontes/overture_edificacoes.py

